# Same single-node hostPath caveat as Postgres (see 10-postgres.yaml): this
# data does not survive node replacement. It matters more than it looks,
# because Redis is the source of truth for tenant config, not just a cache;
# losing it means every tenant's API key stops working.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: torii
spec:
  storageClassName: local-path
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: torii
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # appendonly: tenant writes are durable across pod restarts, not
          # just as of the last periodic snapshot.
          # noeviction: under memory pressure Redis must refuse writes rather
          # than evict keys, since an evicted tenant key is a deleted tenant.
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - 64mb
            - --maxmemory-policy
            - noeviction
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 96Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: torii
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
