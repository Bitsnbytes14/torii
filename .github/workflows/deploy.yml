name: Deploy

# Manual only. CI builds and pushes an image for every commit on main; this
# workflow decides which of those actually runs on the node.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to deploy (blank = tip of the branch you run this from)
        required: false
        type: string

# Never run two deploys against the one node at the same time.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  id-token: write # GitHub OIDC -> AWS role; no stored AWS keys

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The AWS role only trusts jobs in this environment. Add required
    # reviewers to it in repo settings to gate deploys on an approval.
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image tag
        id: tag
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          tag="${INPUT_SHA:-$GITHUB_SHA}"
          if ! printf '%s' "$tag" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha must be a full 40-character lowercase commit SHA, got '$tag'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Fail before touching the cluster if CI never pushed this SHA (e.g. its
      # CI run failed), rather than timing out on ImagePullBackOff.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check images exist
        run: |
          for svc in booking controlplane gateway; do
            docker manifest inspect "${{ steps.tag.outputs.registry }}/torii-$svc:${{ steps.tag.outputs.tag }}" > /dev/null \
              || { echo "::error::no image for torii-$svc at ${{ steps.tag.outputs.tag }}"; exit 1; }
          done

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # SSH is closed to everything but the operator's CIDR. Open it to this
      # runner's IP only, for only as long as the deploy takes.
      - name: Open SSH for this runner
        id: open
        run: |
          ip="$(curl -fsS https://checkip.amazonaws.com)"
          aws ec2 authorize-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$ip/32,Description=github-actions-deploy-$GITHUB_RUN_ID}]"
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      # The host key is pinned from a secret instead of ssh-keyscan at deploy
      # time, which would trust whatever answers on that IP.
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s %s\n' "$EC2_HOST" "$HOST_KEY" > ~/.ssh/known_hosts

      - name: Roll out
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "ubuntu@$EC2_HOST" 'sh -s' -- \
            "${{ steps.tag.outputs.tag }}" "${{ steps.tag.outputs.registry }}" \
            < deploy/scripts/rollout.sh

      - name: Close SSH
        if: always() && steps.open.outputs.ip != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.open.outputs.ip }}/32}]"
