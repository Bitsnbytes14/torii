name: torii

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: torii
      POSTGRES_PASSWORD: torii
      POSTGRES_DB: torii
    ports:
      - "5432:5432"
    volumes:
      - torii_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torii -d torii"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  torii_postgres_data:
